<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atlas</title>
  <link rel="stylesheet" href="../CSS/Welcome.css">
</head>
<body>

  <canvas id="c"></canvas>

  <div class="overlay">
    <h1 class="brand">Atlas</h1>
    <p class="tagline">Curated selection of the best products<br>for those who demand excellence</p>
    <div class="btns">
      <button class="btn" onclick="location.href='Signin.html'">Sign In</button>
      <button class="btn" onclick="location.href='Webpage.html'">Dive In</button>
    </div>
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let t = 0, flakes = [];

    for (let i = 0; i < 150; i++) {
      flakes.push({
        x: Math.random() * 3000,
        y: Math.random() * 3000,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.5 + 0.2
      });
    }

    function draw() {
      const w = c.width = window.innerWidth;
      const h = c.height = window.innerHeight;
      t += 0.02;

      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.moveTo(0, h);

      for (let x = 0; x <= w; x += 10) {
        let baseLine = (h / 2) - (x - w / 2);
        let wobble = Math.sin(x * 0.01 + t) * 30 + Math.sin(x * 0.02 - t) * 15;
        
        ctx.lineTo(x, baseLine + wobble);
      }

      ctx.lineTo(w, h);
      ctx.fill();

      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#ffffff';

      flakes.forEach(f => {
        f.y -= f.speed;
        f.x += f.speed * 0.5;

        if (f.y < 0) f.y = h;
        if (f.x > w) f.x = 0;

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
