<!DOCTYPE html>
<html lang="en">
<head>
    <title>Atlas | Order Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/Portal1.css">
    <link rel="stylesheet" href="../CSS/Cart.css">
 
</head>
<body>
    <header class="site-heading">
        <img src="../Images/atlas.png" alt="Atlas Logo" class="logo" width="150" height="50"/>
    </header>
    <div class="cart-page-container">
        <div class="cart-header">
            <h2>Select Your Quantities</h2>
            <p style="color: #666; margin-top: 5px;">Adjust the numbers below. Total will be calculated securely at checkout.</p>
        </div>

        <div id="dynamic-cart-container">
            <p style="text-align: center; color: #888; padding: 40px 0;">Loading your cart...</p>
        </div>

        <div class="cart-summary" style="text-align: right; margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 20px;">
            <h3 style="color: #888; margin-bottom: 8px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase;">Estimated Total</h3>
            <h2 id="cart-total-price" style="color: #dfb96f; margin: 0; font-weight: 400; letter-spacing: 0.05em;">Rs. 0</h2>
        </div>

        <div class="cart-actions">
            <a href="Webpage.html" class="continue-btn">← Continue Shopping</a>
            <button type="button" class="checkout-btn" onclick="window.location.href='Checkout.html'">Proceed to Checkout →</button>
        </div>

        <script src="../JavaScript/Cart.js"></script>
    </div>
</body>
</html>
